<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetPower PM</title>
<link rel="manifest" href="/pm/manifest.webmanifest">
<meta name="theme-color" content="#24292f">
<link rel="icon" type="image/png" sizes="192x192" href="/pm/img/icon-192.png">
<link rel="apple-touch-icon" href="/pm/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NetPower PM">
<link rel="stylesheet" href="/pm/pm.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu">☰</button>
  <a class="brand" href="#/">Net<span>Power</span> PM</a>
  <nav class="topnav">
    <a href="#/" data-nav="portfolio">Portfolio</a>
    <a href="#/directory" data-nav="directory">Directory</a>
    <a href="#/tasks" data-nav="tasks">My Tasks</a>
  </nav>
  <select id="projectPicker" aria-label="Jump to project"></select>
  <div id="pmMenuWrap" class="pm-menu-wrap"></div>
  <span class="spacer"></span>
  <span id="modeBadge" class="mode-badge" hidden></span>
  <button class="user-btn" id="userBtn"></button>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="main"><div class="loading">Loading…</div></main>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/pm/sw.js", { scope: "/pm/" }).catch(() => {});</script>
<script src="/pm/pm.js"></script>
<script src="/pm/drawings.js"></script>
<script src="/pm/forms.js"></script>
<script src="/pm/auth.js"></script>
<script src="/pm/photos.js"></script>
<script src="/pm/people.js"></script>
<script src="/pm/export.js"></script>
<script src="/pm/tools.js"></script>
<script src="/pm/inspections.js"></script>
<script src="/pm/changeorders.js"></script>
<script src="/pm/equipment.js"></script>
<script src="/pm/tasks.js"></script>
<script src="/pm/jobs.js"></script>
<script src="/pm/assistant-ui.js"></script>
</body>
</html>
